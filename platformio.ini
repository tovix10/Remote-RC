[platformio]
default_envs = nano_tx

; =======================================================
; 1. TRANSMITTER (Arduino Nano ATmega328P)
; =======================================================
[env:nano_tx]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = +<main_tx.cpp> -<main_rx.cpp>
lib_deps =
    nrf24/RF24@^1.4.7

; =======================================================
; 2. RECEIVER (Pro Mini ATmega168 16MHz)
; =======================================================
[env:promini_rx]
platform = atmelavr
board = pro16MHzatmega168
framework = arduino
monitor_speed = 115200
build_src_filter = -<main_tx.cpp> +<main_rx.cpp>
lib_deps =
    nrf24/RF24@^1.4.7
    Servo