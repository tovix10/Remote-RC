[platformio]
default_envs = rx_promini_168p_8mhz

; =================================================================
; 1. TRANSMITTER UTAMA V930 (Pro Mini 168P 3.3V 8MHz)
; =================================================================
[env:tx_promini_168p_8mhz]
platform = atmelavr
board = pro8MHzatmega168
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tx_v930_promini/>
lib_deps =
    nrf24/RF24@^1.4.7

    ; =======================================================
; 2. RECEIVER (Pro Mini ATmega168p 8MHz)
; =======================================================
[env:rx_promini_168p_8mhz]
platform = atmelavr
board = pro8MHzatmega168
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<rx_promini/>
lib_deps =
    nrf24/RF24@^1.4.7
    Servo

; =======================================================
; 3. TRANSMITTER LAMA (Arduino Nano + Stik PS2)
; =======================================================
[env:nano_tx]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tx_ps2_nano/> 
lib_deps =
    nrf24/RF24@^1.4.7
    kurts/PS2X_lib


; =======================================================
; 3. UJICOBA TX V930 (Arduino Nano)
; =======================================================
[env:tx_v930]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tx_v930_nano/> 
lib_deps =
    nrf24/RF24@^1.4.7

; =================================================================
; 4. NANO SEBAGAI PROGRAMMER (ISP)
; =================================================================
[env:nano_as_isp]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_src_filter = -<*> +<programmer.cpp>

; =================================================================
; 5. TARGET BURN BOOTLOADER: PRO MINI 168 (3.3V / 8MHz)
; =================================================================
[env:promini168_8mhz_isp]
platform = atmelavr
board = pro8MHzatmega168
board_build.mcu = atmega168p
framework = arduino
upload_protocol = stk500v1
upload_speed = 19200
upload_port = COM9
upload_flags =
    -P
    COM9
    -b
    19200

; =================================================================
; 6. TARGET BURN BOOTLOADER: NANO 328P (16MHz)
; =================================================================
[env:nano_328p_isp]
platform = atmelavr
board = nanoatmega328new  ; Menggunakan Optiboot (baudrate 115200)
framework = arduino
upload_protocol = stk500v1
upload_speed = 19200
upload_port = COM9        ; Sesuaikan port ini dengan Nano Programmer
upload_flags =
    -P
    $UPLOAD_PORT
    -b
    $UPLOAD_SPEED

; =======================================================
; 7. SCANNER LAYAR (Pro Mini ATmega168p 8MHz)
; =======================================================
[env:promini_8Mhz]
platform = atmelavr
board = pro8MHzatmega168
board_build.mcu = atmega168p
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<scanner.cpp>

[env:nano_tes_blink]
platform = atmelavr
board = nanoatmega328new
framework = arduino
build_src_filter = -<*> +<test_LCD_16202A.cpp>
lib_deps =
    LiquidCrystal@^1.0.7    

; =================================================================
; 8. TARGET BURN BOOTLOADER: PRO MINI 328P (5V / 16MHz)
; =================================================================
[env:promini_328p_16mhz_isp]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
upload_protocol = stk500v1
upload_speed = 19200
upload_port = COM9        ; Memakai port COM9 sesuai Nano Programmer Anda
upload_flags =
    -P
    $UPLOAD_PORT
    -b
    $UPLOAD_SPEED

; =======================================================
; 9. PRO MINI 328P 5V 16MHz (Upload Biasa via FTDI)
; =======================================================
[env:promini_328p_16mhz_ftdi]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
monitor_speed = 115200
; Jangan lupa sesuaikan folder build_src_filter saat akan mengupload sketch
build_src_filter = -<*> +<blink.cpp>