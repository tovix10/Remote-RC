[platformio]
default_envs = tx_v930

; =======================================================
; 1. TRANSMITTER LAMA (Arduino Nano + Stik PS2)
; =======================================================
[env:nano_tx]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = +<tx_nano_ps2/> -<rx/> -<tx_v930/> -<programmer.cpp>
lib_deps =
    nrf24/RF24@^1.4.7
    kurts/PS2X_lib

; =======================================================
; 2. RECEIVER (Pro Mini ATmega168 16MHz)
; =======================================================
[env:promini_rx]
platform = atmelavr
board = pro16MHzatmega168
framework = arduino
monitor_speed = 115200
build_src_filter = -<tx_nano_ps2/> +<rx/> -<tx_v930/> -<programmer.cpp>
lib_deps =
    nrf24/RF24@^1.4.7
    Servo

; =======================================================
; 3. UJICOBA TX V930 (Arduino Nano)
; =======================================================
[env:tx_v930]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = -<tx_nano_ps2/> -<rx/> +<tx_v930/> -<programmer.cpp>
lib_deps =
    nrf24/RF24@^1.4.7

; =================================================================
; 4. NANO SEBAGAI PROGRAMMER (ISP)
; =================================================================
[env:nano_as_isp]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_src_filter = -<*> +<programmer.cpp>

; =================================================================
; 5. TARGET BURN BOOTLOADER: PRO MINI 168 (3.3V / 8MHz)
; =================================================================
[env:promini168_8mhz_isp]
platform = atmelavr
board = pro8MHzatmega168
board_build.mcu = atmega168p
framework = arduino
upload_protocol = stk500v1
upload_speed = 19200
upload_port = COM9
upload_flags =
    -P
    COM9
    -b
    19200

; =================================================================
; 6. TRANSMITTER UTAMA V930 (Pro Mini 168P 3.3V 8MHz)
; =================================================================
[env:tx_promini_168p_8mhz]
platform = atmelavr
board = pro8MHzatmega168
framework = arduino
monitor_speed = 115200
; Fokus hanya mengkompilasi file di dalam folder src/tx_promini/
build_src_filter = -<*> +<tx_promini/>
lib_deps =
    nrf24/RF24@^1.4.7

; =======================================================
; 7. SCANNER LAYAR (Pro Mini ATmega168 16MHz)
; =======================================================
[env:promini_16Mhz]
platform = atmelavr
board = pro16MHzatmega168
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<scanner.cpp>